name: Build Shanghai Temperature

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weather-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Structural checks
        run: |
          python3 scripts/generate_project.py
          python3 scripts/validate_project.py
          git diff --exit-code -- ShanghaiTemperature.xcodeproj App/Info.plist Widgets/Info.plist App/App.entitlements Widgets/Widgets.entitlements
      - name: Map resources and historical replays
        run: |
          python3 scripts/test-build-history.py
          python3 scripts/test-thermal-bands.py
          python3 scripts/test-thermal-map.py
          python3 scripts/check-map-release.py
          python3 scripts/check-map-refresh.py --history Widgets/Resources/WeatherHistory
      - name: Data and cache tests
        run: |
          set -o pipefail
          mkdir -p build
          swift test --scratch-path build/CoreTests 2>&1 | tee build/core-tests.log
      - name: Version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=0.6.4
          if [[ "$REF_TYPE" == tag ]]; then version="${REF_NAME#v}"; fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Compile, sign and package
        env:
          VERSION: ${{ steps.version.outputs.value }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: bash scripts/build-release.sh
      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ShanghaiTemperature-${{ steps.version.outputs.value }}-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.sha }}
          path: build/*.log
          if-no-files-found: ignore
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ShanghaiTemperature-*
          path: dist
          merge-multiple: true
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          cat > release-notes.md <<'EOF'
          0.6.4：修复暂停飞机更新时小组件冻结快照仍被四分钟过期规则过滤的问题。冻结期间保留已准备的飞机图标和文字布局，停止位置过期时间线；恢复后等待新采集结果。主App历史播放和共享请求暂停规则保持原样。

          0.6.2：修复沙盒内用户目录定位，通过POSIX账户记录统一主App和小组件的飞机共享目录。任一端可独立初始化并领取共享请求资格，设置页显示两端初始化进度和共享状态。保留原有缓存、历史和日志，删除旧限流记录的运行时迁移代码。

          0.6.0：主App与小组件共用OpenSky请求名额、限流截止时间和原始飞机JSON批次。共享状态由macOS文件协调机制保护。当时需要两端完成旧限流记录迁移。主App体感底图按数据批次预渲染，交互复用图片，并增量读取飞机历史。小组件四分钟有效期和主App历史播放节奏继续沿用。

          0.5.1：仅小组件将飞机位置最大显示年龄收紧至4分钟，从接口位置更新时间起算，达到240秒后过滤图标及航班文字；布局准备和实际显示使用相同过滤，冻结数据也不能绕过显示时效检查。安排对应到期时间线，实际切换由macOS调度。接口查询间隔及服务器等待规则不变；主App历史播放、地图外观和小组件文本重叠过滤保持原样。

          0.5.0：主App飞机历史正放与倒放改为每个非空画面显示5秒，切换下一帧前清空飞机图层0.5秒，再显示下一帧。温度地图保持显示；下一帧预先准备，播放结束保留最后一帧。窗口隐藏或睡眠时暂停播放计时；空白间隔中停止或重新拖动时恢复上一帧。小组件沿用0.4.9的航班文本重叠过滤及飞机显示规则。

          0.4.9：仅小组件增加飞机航班文本重叠过滤。按现有布局顺序保留优先文本；后续文本与任一已显示航班文本的交集面积超过两者较小面积的60%时隐藏，恰好60%仍显示。被隐藏文本不参与后续比较，不因该过滤移动文本或尝试短标签；飞机图标保留。主App及飞机历史播放不启用此过滤；地图尺寸、颜色、飞机有效期与请求等待规则沿用0.4.8。

          0.4.8：主App地图调整为紧凑版的约125%，画布250×288点、外框276×314点；飞机图标保持白色，航班文字保持灰色。

          0.4.6：主App地图画布调整为200×230点，飞机图标保持白色，航班文字改为与小组件一致的灰色。保留历史播放与刷新优化。

          0.4.4：修复小组件冻结飞机绕过位置过期检查的问题，并为冻结画面安排位置过期时间线。主App历史播放行为保持原样。

          0.4.2：主App采用浅灰背景（RGB 0.93 / 0.94 / 0.95），调整时间尺和配置入口对比度。共享飞机历史检查改为每30秒；本App采集完成后立即读取。网络刷新按允许时间等待，窗口可见性通过通知更新，减少空闲轮询；时间尺与飞机层独立观察播放状态，减少拖动时温度地图重复构建。历史播放仍约一秒一帧。桌面小组件外观、刷新策略及共享飞机筛选和历史存储逻辑保持原样。交互流畅度仍需实机验证。

          新增第6个大号组件“江浙沪 · 体感地图”，原有5个组件及App名“上海温度”保持不变。

          按100个经纬度点生成连续温度面，每条显示温度带跨度不超过3°C；显示指定的小写地点名称。顶部显示相邻节气，交节当天仅显示该节气名。内置2015—2025年完整ERA5气温、湿度、风速历史数据，约57.9MB。

          主界面“本地计算地图体感”开关默认关闭：关闭使用网络API体感，开启使用本地阴凉处体感公式；当天与历史使用相同定义。请求约每小时更新，实际由macOS调度。网络模式首次需要分批准备历史体感数据，会显示进度；本地模式无需补下载历史体感。失败使用标注的旧缓存，最长48小时，不切换算法或展示假天气。

          显示较往年同期偏冷/偏暖；连续多日比较不稳定时，不显示提前/推迟提示。这不是正式入季判定。数据来源Open-Meteo（CC BY 4.0），地图来源Natural Earth（public domain）。

          这是个人预览版：应用与WidgetKit扩展均为ad-hoc签名，未经Apple公证。自动编译与数据测试通过不代表桌面组件已完成实机验证；首次运行可能被macOS提示限制。

          0.4.0：主App新增地图与飞机历史时间尺，配置默认收起。快速拖动定位后停留，缓慢拖动选择区间，松开后正放或倒放；有飞机的历史帧按约一秒一帧展示。播放结束保留最后一个有飞机的画面，后续新采集的非空数据继续更新，空响应不清空主App已有飞机画面。历史保留8天，时间尺开放最近24小时，数据从启用功能后开始积累。

          飞机位置统一以10分钟为有效期，最多显示10架，取消20%抽样。飞机图标保持真实坐标，标签可左右放置、缩短或隐藏。主App使用白色飞机；小组件外观与交互保持原样，使用相同的位置有效期及数量规则。飞机接口约10分钟查询一次，并遵守服务器要求的更长等待时间；系统调度和睡眠可能造成历史缺口，数据覆盖取决于OpenSky。

          下载DMG后将应用拖入“应用程序”，打开一次，再右键桌面→编辑小组件→搜索“上海温度”。附SHA256SUMS.txt校验文件。
          EOF
          gh release create "$TAG" --verify-tag --prerelease \
            --title "上海温度 $TAG（预览版）" --notes-file release-notes.md dist/*
